[package]
name = "notchA"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# --- Pure Rust GUI (Iced 0.14 + Springs + Tray) ---
iced = { version = "0.14", features = ["wgpu", "canvas", "svg", "image", "tokio", "advanced"] }
tray-icon = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# --- Pure Rust Backend (same crate stack as original so modules drop straight in) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
notify = "6"
ureq = { version = "2", features = ["json", "native-tls", "proxy-from-env"] }
native-tls = "0.2"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
ring = "0.17"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Foundation_Numerics",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_Globalization",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_Debug",
] }